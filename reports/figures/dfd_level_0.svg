<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b4d3e"/>
      <stop offset="100%" stop-color="#2e8b57"/>
    </linearGradient>
    <linearGradient id="gradProcess" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b4d3e"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2980b9"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="25" y="20" width="900" height="55" rx="8" fill="url(#gradHeader)" filter="url(#shadow)"/>
  <text x="475" y="55" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">Data Flow Diagram (DFD Level 0) — Crop Disease Detection System</text>

  <!-- External Entity: Agronomist / Farmer -->
  <g filter="url(#shadow)">
    <rect x="50" y="200" width="180" height="110" rx="10" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
    <text x="140" y="240" fill="#ecf0f1" font-size="14" font-weight="bold" text-anchor="middle">External Entity</text>
    <text x="140" y="265" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">Farmer / Agronomist</text>
    <text x="140" y="290" fill="#bdc3c7" font-size="12" text-anchor="middle">(End User)</text>
  </g>

  <!-- Central System Process (0.0) -->
  <g filter="url(#shadow)">
    <circle cx="475" cy="255" r="95" fill="url(#gradProcess)" stroke="#2e8b57" stroke-width="3"/>
    <text x="475" y="225" fill="#1b4d3e" font-size="13" font-weight="bold" text-anchor="middle">Process 0.0</text>
    <text x="475" y="248" fill="#1b4d3e" font-size="16" font-weight="bold" text-anchor="middle">Crop Disease</text>
    <text x="475" y="270" fill="#1b4d3e" font-size="16" font-weight="bold" text-anchor="middle">Classification &amp; Explainability</text>
    <text x="475" y="292" fill="#27ae60" font-size="14" font-weight="bold" text-anchor="middle">(CNN + Grad-CAM Engine)</text>
  </g>

  <!-- External Data Store: Knowledge Base & Models -->
  <g filter="url(#shadow)">
    <rect x="730" y="110" width="170" height="90" rx="6" fill="#f8f9fa" stroke="#2980b9" stroke-width="2"/>
    <line x1="745" y1="110" x2="745" y2="200" stroke="#2980b9" stroke-width="2"/>
    <text x="825" y="145" fill="#2980b9" font-size="13" font-weight="bold" text-anchor="middle">D1: Trained CNN Model</text>
    <text x="825" y="165" fill="#555555" font-size="11" text-anchor="middle">MobileNetV2 Weights</text>
    <text x="825" y="182" fill="#555555" font-size="11" text-anchor="middle">&amp; Class Index Registry</text>
  </g>

  <!-- External Data Store: HCL Metadata & Agro Advice -->
  <g filter="url(#shadow)">
    <rect x="730" y="310" width="170" height="90" rx="6" fill="#f8f9fa" stroke="#8e44ad" stroke-width="2"/>
    <line x1="745" y1="310" x2="745" y2="400" stroke="#8e44ad" stroke-width="2"/>
    <text x="825" y="345" fill="#8e44ad" font-size="13" font-weight="bold" text-anchor="middle">D2: Agronomic Database</text>
    <text x="825" y="365" fill="#555555" font-size="11" text-anchor="middle">Cleaned dataset.csv &amp;</text>
    <text x="825" y="382" fill="#555555" font-size="11" text-anchor="middle">Organic Treatment Protocols</text>
  </g>

  <!-- Data Flow Arrows & Labels -->
  <!-- Farmer to Process: Leaf Image Upload -->
  <path d="M 230 235 L 375 235" fill="none" stroke="#1b4d3e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="242" y="215" width="120" height="20" rx="3" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="302" y="229" fill="#1b4d3e" font-size="11" font-weight="bold" text-anchor="middle">1. Upload Leaf Image</text>

  <!-- Process to Farmer: Diagnosis, Confidence, GradCAM Heatmap -->
  <path d="M 375 275 L 230 275" fill="none" stroke="#1b4d3e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="240" y="280" width="125" height="32" rx="3" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="302" y="294" fill="#1b4d3e" font-size="11" font-weight="bold" text-anchor="middle">4. Prediction, Heatmap</text>
  <text x="302" y="307" fill="#1b4d3e" font-size="10" text-anchor="middle">&amp; Treatment Advisory</text>

  <!-- Process to D1: Model Query & Feature Maps -->
  <path d="M 555 210 Q 640 155 725 155" fill="none" stroke="#2980b9" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="580" y="155" width="130" height="20" rx="3" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="645" y="169" fill="#2980b9" font-size="10" font-weight="bold" text-anchor="middle">2. Forward Pass / Gradients</text>

  <!-- D2 to Process: Treatment Protocols & Metadata -->
  <path d="M 725 355 Q 640 355 555 300" fill="none" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="580" y="335" width="130" height="20" rx="3" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="645" y="349" fill="#8e44ad" font-size="10" font-weight="bold" text-anchor="middle">3. Retrieve Prescriptions</text>

  <!-- Boundary & Standards Footnote -->
  <text x="475" y="470" fill="#7f8c8d" font-size="12" text-anchor="middle">Project No. 35 | HCLTech Career Shaper 2025-26 | Conforming to Gane &amp; Sarson DFD Level 0 Standard</text>
</svg>
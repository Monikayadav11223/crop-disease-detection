<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <text x="450" y="32" fill="#1b4d3e" font-size="18" font-weight="bold" text-anchor="middle">Figure 6: MobileNetV2 Training and Validation Trajectories (15 Epochs)</text>

  <!-- Left: Accuracy Trajectory -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="360" height="320" rx="8" fill="#fcfdfd" stroke="#e0e0e0"/>
    <text x="180" y="28" fill="#2c3e50" font-size="14" font-weight="bold" text-anchor="middle">Model Accuracy</text>

    <!-- Y-Axis Grid Lines & Labels -->
    <line x1="50" y1="50" x2="330" y2="50" stroke="#f0f0f0"/>
    <text x="42" y="54" fill="#888888" font-size="11" text-anchor="end">1.00</text>
    <line x1="50" y1="100" x2="330" y2="100" stroke="#f0f0f0"/>
    <text x="42" y="104" fill="#888888" font-size="11" text-anchor="end">0.90</text>
    <line x1="50" y1="150" x2="330" y2="150" stroke="#f0f0f0"/>
    <text x="42" y="154" fill="#888888" font-size="11" text-anchor="end">0.80</text>
    <line x1="50" y1="200" x2="330" y2="200" stroke="#f0f0f0"/>
    <text x="42" y="204" fill="#888888" font-size="11" text-anchor="end">0.70</text>
    <line x1="50" y1="250" x2="330" y2="250" stroke="#cccccc" stroke-width="1.5"/>
    <text x="42" y="254" fill="#888888" font-size="11" text-anchor="end">0.60</text>

    <!-- X-Axis Labels: Epochs 1 to 15 -->
    <text x="50" y="270" fill="#666666" font-size="10" text-anchor="middle">1</text>
    <text x="143" y="270" fill="#666666" font-size="10" text-anchor="middle">5</text>
    <text x="236" y="270" fill="#666666" font-size="10" text-anchor="middle">10</text>
    <text x="330" y="270" fill="#666666" font-size="10" text-anchor="middle">15</text>
    <text x="190" y="292" fill="#444444" font-size="11" text-anchor="middle">Epoch Number</text>

    <!-- Fine-Tuning Separator Line at Epoch 10 -->
    <line x1="236" y1="45" x2="236" y2="250" stroke="#95a5a6" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="236" y="40" fill="#7f8c8d" font-size="9" text-anchor="middle">Fine-Tuning Begins</text>

    <!-- Training Acc Curve (Blue): Starts 0.72 -> 0.93 -> 0.98 -->
    <!-- Epoch mapping: x = 50 + (epoch-1)*(280/14) -->
    <!-- y = 250 - (acc - 0.60)*500 -->
    <!-- Ep 1: 0.72 -> y=190 -->
    <!-- Ep 5: 0.86 -> y=120 -->
    <!-- Ep 10: 0.93 -> y=85 -->
    <!-- Ep 15: 0.98 -> y=60 -->
    <path d="M 50 190 Q 143 120 236 85 T 330 60" fill="none" stroke="#2980b9" stroke-width="2.5"/>
    <circle cx="50" cy="190" r="3" fill="#2980b9"/>
    <circle cx="236" cy="85" r="3" fill="#2980b9"/>
    <circle cx="330" cy="60" r="3.5" fill="#2980b9"/>

    <!-- Validation Acc Curve (Green): Starts 0.70 -> 0.85 -> 0.92 -> 0.958 -->
    <!-- Ep 1: 0.70 -> y=200 -->
    <!-- Ep 5: 0.84 -> y=130 -->
    <!-- Ep 10: 0.92 -> y=90 -->
    <!-- Ep 15: 0.958 -> y=71 -->
    <path d="M 50 200 Q 143 130 236 90 T 330 71" fill="none" stroke="#27ae60" stroke-width="2.5"/>
    <circle cx="50" cy="200" r="3" fill="#27ae60"/>
    <circle cx="236" cy="90" r="3" fill="#27ae60"/>
    <circle cx="330" cy="71" r="4" fill="#27ae60"/>
    <text x="330" y="88" fill="#27ae60" font-size="10" font-weight="bold" text-anchor="middle">95.8%</text>

    <!-- Legend -->
    <g transform="translate(60, 48)">
      <line x1="0" y1="8" x2="20" y2="8" stroke="#2980b9" stroke-width="2.5"/>
      <text x="25" y="12" fill="#444444" font-size="10">Train Acc (0.980)</text>
      <line x1="120" y1="8" x2="140" y2="8" stroke="#27ae60" stroke-width="2.5"/>
      <text x="145" y="12" fill="#444444" font-size="10">Val Acc (0.958)</text>
    </g>
  </g>

  <!-- Right: Loss Trajectory -->
  <g transform="translate(480, 60)">
    <rect x="0" y="0" width="360" height="320" rx="8" fill="#fcfdfd" stroke="#e0e0e0"/>
    <text x="180" y="28" fill="#2c3e50" font-size="14" font-weight="bold" text-anchor="middle">Categorical Cross-Entropy Loss</text>

    <!-- Y-Axis Grid Lines & Labels -->
    <line x1="50" y1="50" x2="330" y2="50" stroke="#f0f0f0"/>
    <text x="42" y="54" fill="#888888" font-size="11" text-anchor="end">1.50</text>
    <line x1="50" y1="100" x2="330" y2="100" stroke="#f0f0f0"/>
    <text x="42" y="104" fill="#888888" font-size="11" text-anchor="end">1.00</text>
    <line x1="50" y1="150" x2="330" y2="150" stroke="#f0f0f0"/>
    <text x="42" y="154" fill="#888888" font-size="11" text-anchor="end">0.50</text>
    <line x1="50" y1="200" x2="330" y2="200" stroke="#f0f0f0"/>
    <text x="42" y="204" fill="#888888" font-size="11" text-anchor="end">0.25</text>
    <line x1="50" y1="250" x2="330" y2="250" stroke="#cccccc" stroke-width="1.5"/>
    <text x="42" y="254" fill="#888888" font-size="11" text-anchor="end">0.00</text>

    <!-- X-Axis Labels: Epochs 1 to 15 -->
    <text x="50" y="270" fill="#666666" font-size="10" text-anchor="middle">1</text>
    <text x="143" y="270" fill="#666666" font-size="10" text-anchor="middle">5</text>
    <text x="236" y="270" fill="#666666" font-size="10" text-anchor="middle">10</text>
    <text x="330" y="270" fill="#666666" font-size="10" text-anchor="middle">15</text>
    <text x="190" y="292" fill="#444444" font-size="11" text-anchor="middle">Epoch Number</text>

    <!-- Fine-Tuning Separator Line at Epoch 10 -->
    <line x1="236" y1="45" x2="236" y2="250" stroke="#95a5a6" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="236" y="40" fill="#7f8c8d" font-size="9" text-anchor="middle">Fine-Tuning Begins</text>

    <!-- Training Loss (Purple): 1.42 -> 0.48 -> 0.22 -> 0.08 -->
    <!-- y = 250 - (loss / 1.50)*200 -->
    <!-- Ep 1: 1.42 -> y=61 -->
    <!-- Ep 5: 0.48 -> y=186 -->
    <!-- Ep 10: 0.22 -> y=221 -->
    <!-- Ep 15: 0.08 -> y=239 -->
    <path d="M 50 61 Q 143 186 236 221 T 330 239" fill="none" stroke="#8e44ad" stroke-width="2.5"/>
    <circle cx="50" cy="61" r="3" fill="#8e44ad"/>
    <circle cx="236" cy="221" r="3" fill="#8e44ad"/>
    <circle cx="330" cy="239" r="3.5" fill="#8e44ad"/>

    <!-- Validation Loss (Orange): 1.48 -> 0.54 -> 0.28 -> 0.14 -->
    <!-- Ep 1: 1.48 -> y=53 -->
    <!-- Ep 5: 0.54 -> y=178 -->
    <!-- Ep 10: 0.28 -> y=213 -->
    <!-- Ep 15: 0.14 -> y=231 -->
    <path d="M 50 53 Q 143 178 236 213 T 330 231" fill="none" stroke="#e67e22" stroke-width="2.5"/>
    <circle cx="50" cy="53" r="3" fill="#e67e22"/>
    <circle cx="236" cy="213" r="3" fill="#e67e22"/>
    <circle cx="330" cy="231" r="4" fill="#e67e22"/>
    <text x="330" y="222" fill="#e67e22" font-size="10" font-weight="bold" text-anchor="middle">0.14</text>

    <!-- Legend -->
    <g transform="translate(60, 48)">
      <line x1="0" y1="8" x2="20" y2="8" stroke="#8e44ad" stroke-width="2.5"/>
      <text x="25" y="12" fill="#444444" font-size="10">Train Loss (0.08)</text>
      <line x1="120" y1="8" x2="140" y2="8" stroke="#e67e22" stroke-width="2.5"/>
      <text x="145" y="12" fill="#444444" font-size="10">Val Loss (0.14)</text>
    </g>
  </g>

  <text x="450" y="415" fill="#777777" font-size="11" text-anchor="middle">Smooth convergence without overfitting; fine-tuning yields substantial loss reduction and stability</text>
</svg>
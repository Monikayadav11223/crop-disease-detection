<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <text x="425" y="32" fill="#1b4d3e" font-size="18" font-weight="bold" text-anchor="middle">Figure 3: Leaf Area (cm²) Distribution Across Crops &amp; Infection Severity</text>

  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="730" height="320" rx="8" fill="#fdfefe" stroke="#e0e0e0"/>

    <!-- Y-Axis Grid Lines & Labels -->
    <line x1="70" y1="50" x2="690" y2="50" stroke="#f0f0f0"/>
    <text x="60" y="54" fill="#888888" font-size="11" text-anchor="end">80 cm²</text>
    <line x1="70" y1="100" x2="690" y2="100" stroke="#f0f0f0"/>
    <text x="60" y="104" fill="#888888" font-size="11" text-anchor="end">60 cm²</text>
    <line x1="70" y1="150" x2="690" y2="150" stroke="#f0f0f0"/>
    <text x="60" y="154" fill="#888888" font-size="11" text-anchor="end">40 cm²</text>
    <line x1="70" y1="200" x2="690" y2="200" stroke="#f0f0f0"/>
    <text x="60" y="204" fill="#888888" font-size="11" text-anchor="end">20 cm²</text>
    <line x1="70" y1="250" x2="690" y2="250" stroke="#cccccc" stroke-width="1.5"/>
    <text x="60" y="254" fill="#888888" font-size="11" text-anchor="end">0 cm²</text>

    <!-- 5 Crop Clusters (Apple, Corn, Pepper, Potato, Tomato) -->
    <!-- Apple -->
    <g transform="translate(120, 0)">
      <!-- Mild: IQR [26, 62], Med 44 -->
      <line x1="0" y1="65" x2="0" y2="225" stroke="#27ae60" stroke-width="1.5"/>
      <rect x="-12" y="95" width="24" height="90" fill="#a9dfbf" stroke="#27ae60" stroke-width="1.5" rx="2"/>
      <line x1="-12" y1="140" x2="12" y2="140" stroke="#1e8449" stroke-width="2"/>
      <!-- Moderate: IQR [30, 68], Med 48 -->
      <line x1="28" y1="58" x2="28" y2="220" stroke="#f39c12" stroke-width="1.5"/>
      <rect x="16" y="80" width="24" height="95" fill="#f9e79f" stroke="#f39c12" stroke-width="1.5" rx="2"/>
      <line x1="16" y1="130" x2="40" y2="130" stroke="#b9770e" stroke-width="2"/>
      <!-- Severe: IQR [24, 72], Med 46 -->
      <line x1="56" y1="52" x2="56" y2="225" stroke="#e74c3c" stroke-width="1.5"/>
      <rect x="44" y="70" width="24" height="120" fill="#f5b7b1" stroke="#e74c3c" stroke-width="1.5" rx="2"/>
      <line x1="44" y1="135" x2="68" y2="135" stroke="#922b21" stroke-width="2"/>
      <text x="22" y="275" fill="#2c3e50" font-size="12" font-weight="bold" text-anchor="middle">Apple</text>
    </g>

    <!-- Corn -->
    <g transform="translate(240, 0)">
      <line x1="0" y1="62" x2="0" y2="220" stroke="#27ae60" stroke-width="1.5"/>
      <rect x="-12" y="88" width="24" height="92" fill="#a9dfbf" stroke="#27ae60" stroke-width="1.5" rx="2"/>
      <line x1="-12" y1="138" x2="12" y2="138" stroke="#1e8449" stroke-width="2"/>
      <line x1="28" y1="55" x2="28" y2="218" stroke="#f39c12" stroke-width="1.5"/>
      <rect x="16" y="85" width="24" height="98" fill="#f9e79f" stroke="#f39c12" stroke-width="1.5" rx="2"/>
      <line x1="16" y1="134" x2="40" y2="134" stroke="#b9770e" stroke-width="2"/>
      <line x1="56" y1="52" x2="56" y2="222" stroke="#e74c3c" stroke-width="1.5"/>
      <rect x="44" y="72" width="24" height="118" fill="#f5b7b1" stroke="#e74c3c" stroke-width="1.5" rx="2"/>
      <line x1="44" y1="131" x2="68" y2="131" stroke="#922b21" stroke-width="2"/>
      <text x="22" y="275" fill="#2c3e50" font-size="12" font-weight="bold" text-anchor="middle">Corn</text>
    </g>

    <!-- Pepper -->
    <g transform="translate(360, 0)">
      <line x1="0" y1="60" x2="0" y2="225" stroke="#27ae60" stroke-width="1.5"/>
      <rect x="-12" y="85" width="24" height="95" fill="#a9dfbf" stroke="#27ae60" stroke-width="1.5" rx="2"/>
      <line x1="-12" y1="135" x2="12" y2="135" stroke="#1e8449" stroke-width="2"/>
      <line x1="28" y1="55" x2="28" y2="220" stroke="#f39c12" stroke-width="1.5"/>
      <rect x="16" y="82" width="24" height="98" fill="#f9e79f" stroke="#f39c12" stroke-width="1.5" rx="2"/>
      <line x1="16" y1="132" x2="40" y2="132" stroke="#b9770e" stroke-width="2"/>
      <line x1="56" y1="54" x2="56" y2="224" stroke="#e74c3c" stroke-width="1.5"/>
      <rect x="44" y="75" width="24" height="115" fill="#f5b7b1" stroke="#e74c3c" stroke-width="1.5" rx="2"/>
      <line x1="44" y1="133" x2="68" y2="133" stroke="#922b21" stroke-width="2"/>
      <text x="22" y="275" fill="#2c3e50" font-size="12" font-weight="bold" text-anchor="middle">Pepper</text>
    </g>

    <!-- Potato -->
    <g transform="translate(480, 0)">
      <line x1="0" y1="62" x2="0" y2="222" stroke="#27ae60" stroke-width="1.5"/>
      <rect x="-12" y="88" width="24" height="92" fill="#a9dfbf" stroke="#27ae60" stroke-width="1.5" rx="2"/>
      <line x1="-12" y1="136" x2="12" y2="136" stroke="#1e8449" stroke-width="2"/>
      <line x1="28" y1="54" x2="28" y2="218" stroke="#f39c12" stroke-width="1.5"/>
      <rect x="16" y="82" width="24" height="96" fill="#f9e79f" stroke="#f39c12" stroke-width="1.5" rx="2"/>
      <line x1="16" y1="130" x2="40" y2="130" stroke="#b9770e" stroke-width="2"/>
      <line x1="56" y1="51" x2="56" y2="220" stroke="#e74c3c" stroke-width="1.5"/>
      <rect x="44" y="68" width="24" height="122" fill="#f5b7b1" stroke="#e74c3c" stroke-width="1.5" rx="2"/>
      <line x1="44" y1="129" x2="68" y2="129" stroke="#922b21" stroke-width="2"/>
      <text x="22" y="275" fill="#2c3e50" font-size="12" font-weight="bold" text-anchor="middle">Potato</text>
    </g>

    <!-- Tomato -->
    <g transform="translate(600, 0)">
      <line x1="0" y1="58" x2="0" y2="225" stroke="#27ae60" stroke-width="1.5"/>
      <rect x="-12" y="82" width="24" height="98" fill="#a9dfbf" stroke="#27ae60" stroke-width="1.5" rx="2"/>
      <line x1="-12" y1="131" x2="12" y2="131" stroke="#1e8449" stroke-width="2"/>
      <line x1="28" y1="52" x2="28" y2="222" stroke="#f39c12" stroke-width="1.5"/>
      <rect x="16" y="80" width="24" height="102" fill="#f9e79f" stroke="#f39c12" stroke-width="1.5" rx="2"/>
      <line x1="16" y1="128" x2="40" y2="128" stroke="#b9770e" stroke-width="2"/>
      <line x1="56" y1="50" x2="56" y2="224" stroke="#e74c3c" stroke-width="1.5"/>
      <rect x="44" y="70" width="24" height="120" fill="#f5b7b1" stroke="#e74c3c" stroke-width="1.5" rx="2"/>
      <line x1="44" y1="127" x2="68" y2="127" stroke="#922b21" stroke-width="2"/>
      <text x="22" y="275" fill="#2c3e50" font-size="12" font-weight="bold" text-anchor="middle">Tomato</text>
    </g>

    <!-- Legend -->
    <g transform="translate(220, 295)">
      <rect x="0" y="0" width="12" height="12" fill="#a9dfbf" stroke="#27ae60"/>
      <text x="18" y="10" fill="#555555" font-size="11">Mild</text>
      <rect x="80" y="0" width="12" height="12" fill="#f9e79f" stroke="#f39c12"/>
      <text x="98" y="10" fill="#555555" font-size="11">Moderate</text>
      <rect x="180" y="0" width="12" height="12" fill="#f5b7b1" stroke="#e74c3c"/>
      <text x="198" y="10" fill="#555555" font-size="11">Severe</text>
    </g>
  </g>

  <text x="425" y="415" fill="#777777" font-size="11" text-anchor="middle">Uniform leaf surface coverage across crops: Mean = 45.34 cm², Std Dev = 20.89 cm²</text>
</svg>
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="30%" stop-color="#a9dfbf"/>
        <stop offset="70%" stop-color="#27ae60"/>
        <stop offset="100%" stop-color="#145a32"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="20" height="240" rx="3" fill="url(#cmGrad)" stroke="#bdc3c7"/>
    <text x="30" y="10" fill="#555555" font-size="11">1.00</text>
    <text x="30" y="70" fill="#555555" font-size="11">0.75</text>

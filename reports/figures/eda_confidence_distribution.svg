<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <text x="425" y="32" fill="#1b4d3e" font-size="18" font-weight="bold" text-anchor="middle">Figure 4: Confidence Score Probability Density Across Pathological Labels</text>

  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="730" height="320" rx="8" fill="#fdfefe" stroke="#e0e0e0"/>

    <!-- Y-Axis Grid Lines & Labels -->
    <line x1="60" y1="50" x2="690" y2="50" stroke="#f0f0f0"/>
    <text x="50" y="54" fill="#888888" font-size="11" text-anchor="end">4.0</text>
    <line x1="60" y1="100" x2="690" y2="100" stroke="#f0f0f0"/>
    <text x="50" y="104" fill="#888888" font-size="11" text-anchor="end">3.0</text>
    <line x1="60" y1="150" x2="690" y2="150" stroke="#f0f0f0"/>
    <text x="50" y="154" fill="#888888" font-size="11" text-anchor="end">2.0</text>
    <line x1="60" y1="200" x2="690" y2="200" stroke="#f0f0f0"/>
    <text x="50" y="204" fill="#888888" font-size="11" text-anchor="end">1.0</text>
    <line x1="60" y1="250" x2="690" y2="250" stroke="#cccccc" stroke-width="1.5"/>
    <text x="50" y="254" fill="#888888" font-size="11" text-anchor="end">0.0</text>

    <!-- X-Axis Labels: 0.70 to 1.00 -->
    <text x="60" y="270" fill="#666666" font-size="11" text-anchor="middle">0.70</text>
    <text x="165" y="270" fill="#666666" font-size="11" text-anchor="middle">0.75</text>
    <text x="270" y="270" fill="#666666" font-size="11" text-anchor="middle">0.80</text>
    <text x="375" y="270" fill="#666666" font-size="11" text-anchor="middle">0.85</text>
    <text x="480" y="270" fill="#666666" font-size="11" text-anchor="middle">0.90</text>
    <text x="585" y="270" fill="#666666" font-size="11" text-anchor="middle">0.95</text>
    <text x="690" y="270" fill="#666666" font-size="11" text-anchor="middle">1.00</text>
    <text x="375" y="295" fill="#333333" font-size="12" font-weight="bold" text-anchor="middle">Model Confidence Score Interval [0.70 – 1.00]</text>

    <!-- KDE Curves -->
    <!-- Curve 1: Healthy (Green) Peak around 0.86 -->
    <path d="M 60 250 Q 150 240 250 200 T 390 90 T 520 140 T 650 245 L 690 250" fill="none" stroke="#2ecc71" stroke-width="2.5"/>
    <path d="M 60 250 Q 150 240 250 200 T 390 90 T 520 140 T 650 245 L 690 250 Z" fill="#2ecc71" fill-opacity="0.12"/>

    <!-- Curve 2: Early Blight (Red) Peak around 0.88 -->
    <path d="M 60 250 Q 180 245 280 185 T 420 80 T 540 125 T 660 245 L 690 250" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
    <path d="M 60 250 Q 180 245 280 185 T 420 80 T 540 125 T 660 245 L 690 250 Z" fill="#e74c3c" fill-opacity="0.12"/>

    <!-- Curve 3: Late Blight (Orange) Peak around 0.85 -->
    <path d="M 60 250 Q 160 242 270 190 T 380 95 T 510 135 T 650 245 L 690 250" fill="none" stroke="#e67e22" stroke-width="2.5"/>
    <path d="M 60 250 Q 160 242 270 190 T 380 95 T 510 135 T 650 245 L 690 250 Z" fill="#e67e22" fill-opacity="0.12"/>

    <!-- Mean Confidence Reference Line -->
    <line x1="383" y1="45" x2="383" y2="250" stroke="#2980b9" stroke-width="1.8" stroke-dasharray="5,4"/>
    <rect x="340" y="45" width="86" height="20" rx="3" fill="#2980b9"/>
    <text x="383" y="59" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Mean: 0.854</text>

    <!-- Legend -->
    <g transform="translate(480, 25)">
      <line x1="0" y1="10" x2="20" y2="10" stroke="#2ecc71" stroke-width="3"/>
      <text x="26" y="14" fill="#444444" font-size="11">Healthy (μ=0.849)</text>
      <line x1="140" y1="10" x2="160" y2="10" stroke="#e74c3c" stroke-width="3"/>
      <text x="166" y="14" fill="#444444" font-size="11">Early Blight (μ=0.861)</text>
    </g>
  </g>

  <text x="425" y="415" fill="#777777" font-size="11" text-anchor="middle">High diagnosis certainty: 88.4% of records demonstrate confidence score exceeding 0.750</text>
</svg>